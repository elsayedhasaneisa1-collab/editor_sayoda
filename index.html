<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>محرري الذكي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg:#1e1e1e; --panel:#252526; --border:#333; --text:#fff; --accent:#0e639c; --accent-hover:#1177bb; --ai:#6a3d9a; }
body.light { --bg:#f5f5f5; --panel:#fff; --border:#ddd; --text:#333; }
body { font-family:system-ui; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:var(--panel); padding:8px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); gap:8px; flex-wrap:wrap; }
header h1 { font-size:16px; color:#4ec9b0; white-space:nowrap; }
.toolbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
select, button { background:var(--accent); color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-family:inherit; font-size:13px; }
select { background:#3c3c3c; }
button:hover { background:var(--accent-hover); }
button.ai { background:var(--ai); }
button.small { padding:4px 8px; font-size:12px; }
button.icon { background:transparent; padding:4px 8px; }
button.icon:hover { background:rgba(255,255,255,0.1); }
.tabs-bar { display:flex; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; align-items:center; }
.tab { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; border-left:1px solid var(--border); font-size:13px; white-space:nowrap; }
.tab.active { background:var(--bg); border-bottom:2px solid #4ec9b0; }
.tab .close { opacity:0.5; font-size:14px; }
.tab .close:hover { opacity:1; color:#f48771; }
.tab-add { padding:8px 12px; cursor:pointer; font-size:18px; opacity:0.7; }
.tab-add:hover { opacity:1; }
.container { display:flex; flex:1; overflow:hidden; }
#editor { flex:1; height:100%; }
#preview { flex:1; background:#fff; border:none; }
.resizer { width:5px; background:var(--border); cursor:col-resize; }
.split-horizontal { flex-direction:column; }
.split-horizontal .resizer { width:100%; height:5px; cursor:row-resize; }
.hide-preview #preview, .hide-preview .resizer { display:none; }
.hide-editor #editor, .hide-editor .resizer { display:none; }
.console-panel { height:150px; background:var(--panel); border-top:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; transition:height 0.2s; }
.console-panel.collapsed { height:30px; }
.console-header { padding:4px 12px; font-size:12px; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); cursor:pointer; }
.console-body { flex:1; overflow-y:auto; font-family:monospace; font-size:12px; padding:4px 12px; }
.console-line { padding:2px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.console-line.error { color:#f48771; }
.console-line.warn { color:#dcdcaa; }
.console-line.log { color:#4ec9b0; }
.console-line.info { color:#9cdcfe; }
.status-bar { background:var(--accent); color:#fff; padding:3px 12px; font-size:12px; display:flex; justify-content:space-between; font-family:monospace; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:1000; }
.modal.open { display:flex; }
.modal-content { background:var(--panel); padding:24px; border-radius:8px; max-width:600px; width:90%; max-height:80vh; overflow-y:auto; }
.modal-content h2 { margin-bottom:16px; color:#4ec9b0; }
.snippet-item { padding:10px; margin-bottom:8px; background:var(--bg); border:1px solid var(--border); border-radius:4px; cursor:pointer; }
.snippet-item:hover { border-color:#4ec9b0; }
.snippet-item h3 { font-size:14px; margin-bottom:4px; }
.snippet-item p { font-size:12px; opacity:0.7; }
.close-modal { float:left; cursor:pointer; font-size:20px; }
.toast { position:fixed; bottom:50px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 20px; border-radius:4px; opacity:0; transition:opacity 0.3s; z-index:2000; pointer-events:none; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🧠 محرري الذكي</h1>
  <div class="toolbar">
    <select id="langSelect">
      <option value="html">HTML</option>
      <option value="javascript">JavaScript</option>
      <option value="css">CSS</option>
      <option value="typescript">TypeScript</option>
      <option value="json">JSON</option>
      <option value="markdown">Markdown</option>
      <option value="python">Python</option>
      <option value="sql">SQL</option>
    </select>
    <select id="themeSelect">
      <option value="vs-dark">داكن</option>
      <option value="vs">فاتح</option>
      <option value="hc-black">تباين عالي</option>
    </select>
    <select id="splitSelect">
      <option value="split">جنب لجنب</option>
      <option value="split-horizontal">فوق تحت</option>
      <option value="editor-only">المحرر فقط</option>
      <option value="preview-only">المعاينة فقط</option>
    </select>
    <button onclick="runCode()">▶ شغّل</button>
    <button onclick="formatCode()">✨ تنسيق</button>
    <button onclick="copyCode()">📋 نسخ</button>
    <button onclick="downloadFile()">⬇ تحميل</button>
    <button onclick="document.getElementById('fileInput').click()">⬆ رفع</button>
    <button onclick="openSnippets()">📚 أمثلة</button>
    <button onclick="shareLink()">🔗 مشاركة</button>
    <button onclick="exportImage()">🖼 صورة</button>
    <button class="small" onclick="changeFontSize(-1)">A−</button>
    <button class="small" onclick="changeFontSize(1)">A+</button>
    <button class="icon" onclick="toggleTheme()">🌓</button>
    <button class="ai" onclick="askAI()">🤖 AI</button>
  </div>
  <input type="file" id="fileInput" style="display:none" accept=".html,.js,.css,.json,.md,.ts,.py,.sql,.txt">
</header>
<div class="tabs-bar" id="tabsBar"></div>
<div class="container" id="mainContainer">
  <div id="editor"></div>
  <div class="resizer" id="resizer"></div>
  <iframe id="preview"></iframe>
</div>
<div class="console-panel" id="consolePanel">
  <div class="console-header" onclick="toggleConsole()">
    <span>🖥 Console <span id="consoleCount">(0)</span></span>
    <span>▼</span>
  </div>
  <div class="console-body" id="consoleBody"></div>
</div>
<div class="status-bar">
  <span id="statusInfo">سطر 1، عمود 1</span>
  <span id="statusStats">0 كلمة</span>
</div>
<div class="modal" id="snippetsModal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeSnippets()">✕</span>
    <h2>📚 أمثلة جاهزة</h2>
    <div id="snippetsList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/3.1.0/standalone.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/3.1.0/plugins/html.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/3.1.0/plugins/postcss.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prettier/3.1.0/plugins/babel.js"></script>
<script>
'use strict';
const state = { tabs:[], activeTabId:null, models:{}, livePreview:true, consoleCount:0, debounceTimer:null };
let editor, monacoReady=false, tabCounter=0;
const STORAGE_KEY='smart_editor_v1', THEME_KEY='smart_editor_theme', FONT_KEY='smart_editor_font';
const DEFAULT_CODE=`<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family:system-ui; text-align:center; padding:50px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; }
    button { padding:12px 24px; font-size:16px; border:none; border-radius:8px; cursor:pointer; background:white; color:#333; }
  </style>
</head>
<body>
  <h1>مرحبا بالعالم 👋</h1>
  <p>ابدأ اكتب كودك هنا وشوف النتيجة فوراً!</p>
  <button onclick="console.log('تم الضغط!')">اضغطني</button>
  <script>console.log('أهلاً بيك في المحرر الذكي!');<\/script>
</body>
</html>`;
const SNIPPETS=[
 {name:'زر تفاعلي',desc:'زر مع تأثير Hover',lang:'html',code:`<button class="btn">اضغطني</button>\n<style>\n.btn { padding:12px 24px; background:#4CAF50; color:white; border:none; border-radius:8px; cursor:pointer; }\n.btn:hover { background:#45a049; transform:scale(1.05); }\n</style>`},
 {name:'نموذج تسجيل',desc:'نموذج Login بسيط',lang:'html',code:`<form onsubmit="event.preventDefault(); alert('تم')">\n  <input type="text" placeholder="الاسم" required>\n  <input type="email" placeholder="البريد" required>\n  <input type="password" placeholder="كلمة المرور" required>\n  <button>تسجيل</button>\n</form>\n<style>\nform { display:flex; flex-direction:column; gap:10px; max-width:300px; margin:auto; }\ninput, button { padding:10px; border-radius:6px; border:1px solid #ccc; }\nbutton { background:#4CAF50; color:white; border:none; cursor:pointer; }\n</style>`},
 {name:'Fetch API',desc:'جلب بيانات من API',lang:'javascript',code:`fetch('https://jsonplaceholder.typicode.com/posts/1')\n  .then(r => r.json())\n  .then(d => console.log(d))\n  .catch(e => console.error(e));`},
 {name:'Flexbox Grid',desc:'شبكة Responsive',lang:'html',code:`<div class="grid"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>\n<style>\n.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; }\n.grid > div { background:#4CAF50; color:white; padding:20px; text-align:center; border-radius:8px; }\n</style>`},
 {name:'Counter',desc:'عداد بسيط',lang:'html',code:`<h1 id="c">0</h1>\n<button onclick="ch(1)">+</button>\n<button onclick="ch(-1)">-</button>\n<script>\nlet n=0; function ch(d){ n+=d; document.getElementById('c').textContent=n; }\n<\/script>`},
 {name:'Dark Mode',desc:'تبديل الوضع الداكن',lang:'html',code:`<button onclick="document.body.classList.toggle('dark')">تبديل</button>\n<style>\nbody{transition:.3s;padding:30px}\nbody.dark{background:#222;color:#fff}\nbutton{padding:10px 20px;cursor:pointer}\n</style>`},
 {name:'Async/Await',desc:'نموذج غير متزامن',lang:'javascript',code:`async function getUser(){\n  try {\n    const r = await fetch('https://jsonplaceholder.typicode.com/users/1');\n    const u = await r.json();\n    console.log(u);\n  } catch(e) { console.error(e); }\n}\ngetUser();`},
 {name:'Loop مصفوفة',desc:'forEach و map',lang:'javascript',code:`const nums=[1,2,3,4,5];\nnums.forEach(n => console.log(n));\nconsole.log(nums.map(n => n*2));`}
];
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function debounce(fn,w){return function(...a){clearTimeout(state.debounceTimer);state.debounceTimer=setTimeout(()=>fn.apply(this,a),w);};}
function getActiveModel(){return state.activeTabId?state.models[state.activeTabId]:null;}
function getModelValue(){const m=getActiveModel();return m?m.getValue():'';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function saveToStorage(){try{const data={tabs:state.tabs.map(t=>({id:t.id,name:t.name,language:t.language,content:state.models[t.id]?.getValue()||''})),activeTabId:state.activeTabId};localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){console.error(e);}}
function loadFromStorage(){try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function createTab(name,language,content){const id='tab_'+(++tabCounter);const model=monaco.editor.createModel(content,language||'html');state.models[id]=model;state.tabs.push({id,name:name||`ملف ${tabCounter}`,language:language||'html'});model.onDidChangeContent(debounce(()=>{saveToStorage();updateStatus();if(state.livePreview)runCode();},400));return id;}
function addNewTab(content,language,name){const id=createTab(name,language,content||'<!-- كود جديد -->');switchTab(id);renderTabs();}
function switchTab(id){if(!state.models[id])return;state.activeTabId=id;editor.setModel(state.models[id]);const t=state.tabs.find(x=>x.id===id);if(t){document.getElementById('langSelect').value=t.language;monaco.editor.setModelLanguage(state.models[id],t.language);}renderTabs();updateStatus();saveToStorage();}
function closeTab(id,event){if(event)event.stopPropagation();const idx=state.tabs.findIndex(t=>t.id===id);if(idx===-1)return;state.tabs.splice(idx,1);const m=state.models[id];if(m)m.dispose();delete state.models[id];if(state.activeTabId===id){if(state.tabs.length>0){const n=Math.min(idx,state.tabs.length-1);switchTab(state.tabs[n].id);}else{state.activeTabId=null;editor.setModel(null);}}renderTabs();saveToStorage();}
function renderTabs(){const bar=document.getElementById('tabsBar');bar.innerHTML='<div class="tab-add" onclick="addNewTab()" title="جديد">+</div>';state.tabs.forEach(t=>{const d=document.createElement('div');d.className='tab'+(t.id===state.activeTabId?' active':'');d.onclick=()=>switchTab(t.id);d.innerHTML=`<span>${escapeHtml(t.name)}</span><span class="close" onclick="closeTab('${t.id}',event)">✕</span>`;bar.appendChild(d);});}
function initEditor(){const savedTheme=localStorage.getItem(THEME_KEY)||'vs-dark';const savedFont=parseInt(localStorage.getItem(FONT_KEY))||14;document.getElementById('themeSelect').value=savedTheme;editor=monaco.editor.create(document.getElementById('editor'),{theme:savedTheme,fontSize:savedFont,automaticLayout:true,minimap:{enabled:true},wordWrap:'on',scrollBeyondLastLine:false,tabSize:2,suggestOnTriggerCharacters:true,quickSuggestions:true});monacoReady=true;setTheme(savedTheme);
editor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.KeyS,()=>{saveToStorage();showToast('✅ تم الحفظ');});
editor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.Enter,runCode);
editor.onDidChangeCursorPosition(e=>{document.getElementById('statusInfo').textContent=`سطر ${e.position.lineNumber}، عمود ${e.position.column}`;});
monaco.languages.registerCompletionItemProvider('javascript',{provideCompletionItems:()=>({suggestions:[
 {label:'clg',kind:monaco.languages.CompletionItemKind.Snippet,insertText:'console.log($1);',insertTextRules:monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,insertTextRules:4,documentation:'console.log'},
 {label:'fn',kind:monaco.languages.CompletionItemKind.Snippet,insertText:'function ${1:name}(${2:params}) {\n\t$0\n}',insertTextRules:4},
 {label:'afn',kind:monaco.languages.CompletionItemKind.Snippet,insertText:'async function ${1:name}(${2:params}) {\n\t$0\n}',insertTextRules:4},
 {label:'forof',kind:monaco.languages.CompletionItemKind.Snippet,insertText:'for (const ${1:item} of ${2:arr}) {\n\t$0\n}',insertTextRules:4},
 {label:'tryc',kind:monaco.languages.CompletionItemKind.Snippet,insertText:'try {\n\t$1\n} catch (${2:err}) {\n\t$0\n}',insertTextRules:4}
]})});
const saved=loadFromStorage();if(saved&&saved.tabs&&saved.tabs.length>0){saved.tabs.forEach(t=>{const m=monaco.editor.createModel(t.content,t.language);state.models[t.id]=m;state.tabs.push({id:t.id,name:t.name,language:t.language});tabCounter=Math.max(tabCounter,parseInt(t.id.replace('tab_',''))||0);m.onDidChangeContent(debounce(()=>{saveToStorage();updateStatus();if(state.livePreview)runCode();},400));});switchTab(saved.activeTabId&&state.models[saved.activeTabId]?saved.activeTabId:state.tabs[0].id);}else{addNewTab(DEFAULT_CODE,'html','index.html');}
checkShareLink();renderTabs();updateStatus();runCode();}
const CONSOLE_INJECT=`<script>(function(){const s=(l,a)=>{parent.postMessage({type:'console',level:l,args:a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x);}catch(e){return String(x);}})},'*');};['log','error','warn','info'].forEach(m=>{const o=console[m];console[m]=(...a)=>{s(m,a);o.apply(console,a);};});window.onerror=(msg,url,line)=>s('error',[msg+' (سطر '+line+')']);})();<\/script>`;
function runCode(){if(!monacoReady||!state.activeTabId)return;const code=getModelValue();const lang=document.getElementById('langSelect').value;const preview=document.getElementById('preview');clearConsole();let srcdoc='';
if(lang==='html'){if(code.includes('</head>'))srcdoc=code.replace('</head>',CONSOLE_INJECT+'</head>');else if(/<head[^>]*>/i.test(code))srcdoc=code.replace(/<head[^>]*>/i,m=>m+CONSOLE_INJECT);else if(/<body[^>]*>/i.test(code))srcdoc=code.replace(/<body[^>]*>/i,m=>m+CONSOLE_INJECT);else srcdoc=CONSOLE_INJECT+code;}
else if(lang==='css'){srcdoc=CONSOLE_INJECT+`<style>${code}</style><div class="test" style="padding:20px;font-family:system-ui">اختبار CSS</div>`;}
else if(lang==='javascript'||lang==='typescript'){srcdoc=CONSOLE_INJECT+`<body style="font-family:monospace;padding:20px;background:#1e1e1e;color:#fff"><h3>نتيجة التنفيذ:</h3><div id="out"></div><script>const out=document.getElementById('out');const ol=console.log;console.log=(...a)=>{out.innerHTML+='<div>› '+a.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' ')+'</div>';ol(...a);};${code}<\/script></body>`;}
else if(lang==='json'){try{const p=JSON.parse(code);srcdoc=CONSOLE_INJECT+`<pre style="padding:20px;background:#1e1e1e;color:#fff">${escapeHtml(JSON.stringify(p,null,2))}</pre>`;}catch(e){srcdoc=`<pre style="padding:20px;color:red">JSON غير صالح: ${escapeHtml(e.message)}</pre>`;}}
else if(lang==='markdown'){const safe=code.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${');srcdoc=`<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body><div id="md" style="padding:20px;font-family:system-ui;line-height:1.6"></div><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script><script>window.addEventListener('load',()=>{document.getElementById('md').innerHTML=marked.parse(\`${safe}\`);});<\/script></body></html>`;}
else{srcdoc=`<pre style="padding:20px;font-family:monospace">لغة ${lang} مش مدعومة في المعاينة المباشرة.</pre>`;}
preview.srcdoc=srcdoc;updateStatus();}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='console')addConsoleLine(e.data.level,e.data.args.join(' '));});
function addConsoleLine(level,text){const b=document.getElementById('consoleBody');const l=document.createElement('div');l.className='console-line '+(level||'log');const ic={log:'›',error:'✕',warn:'⚠',info:'ℹ'};l.textContent=(ic[level]||'›')+' '+text;b.appendChild(l);b.scrollTop=b.scrollHeight;state.consoleCount++;document.getElementById('consoleCount').textContent=`(${state.consoleCount})`;}
function clearConsole(){document.getElementById('consoleBody').innerHTML='';state.consoleCount=0;document.getElementById('consoleCount').textContent='(0)';}
function toggleConsole(){document.getElementById('consolePanel').classList.toggle('collapsed');}
function copyCode(){if(!getActiveModel())return;navigator.clipboard.writeText(getModelValue()).then(()=>showToast('✅ تم النسخ'));}
function downloadFile(){if(!getActiveModel())return;const lang=document.getElementById('langSelect').value;const ext={html:'html',javascript:'js',css:'css',typescript:'ts',json:'json',markdown:'md',python:'py',sql:'sql'}[lang]||'txt';const tab=state.tabs.find(t=>t.id===state.activeTabId);const blob=new Blob([getModelValue()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(tab?.name||'code').replace(/\.[^.]+$/,'')+'.'+ext;a.click();URL.revokeObjectURL(a.href);showToast('⬇ تم التحميل');}
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const ext=f.name.split('.').pop().toLowerCase();const map={html:'html',js:'javascript',css:'css',ts:'typescript',json:'json',md:'markdown',py:'python',sql:'sql'};addNewTab(ev.target.result,map[ext]||'plaintext',f.name);showToast('⬆ تم الرفع');};r.readAsText(f);e.target.value='';});
async function formatCode(){if(!getActiveModel())return;const code=getModelValue();const lang=document.getElementById('langSelect').value;try{let f=code;if(typeof prettier==='undefined'){showToast('⚠ Prettier لم يُحمّل');return;}
if(lang==='html')f=await prettier.format(code,{parser:'html',plugins:[prettierPlugins.html],tabWidth:2});
else if(lang==='css')f=await prettier.format(code,{parser:'css',plugins:[prettierPlugins.postcss],tabWidth:2});
else if(lang==='javascript'||lang==='typescript')f=await prettier.format(code,{parser:lang==='typescript'?'typescript':'babel',plugins:[prettierPlugins.babel],tabWidth:2});
else if(lang==='json')f=JSON.stringify(JSON.parse(code),null,2);
else{showToast('⚠ التنسيق غير مدعوم لهذه اللغة');return;}
editor.setValue(f);showToast('✨ تم التنسيق');}catch(e){showToast('❌ '+e.message.substring(0,50));}}
function changeFontSize(d){if(!editor)return;const cur=editor.getOption(monaco.editor.EditorOption.fontSize);const n=Math.max(10,Math.min(30,cur+d));editor.updateOptions({fontSize:n});localStorage.setItem(FONT_KEY,n);showToast('حجم الخط: '+n);}
function toggleTheme(){const ts=['vs-dark','vs','hc-black'];const c=document.getElementById('themeSelect').value;const nx=ts[(ts.indexOf(c)+1)%ts.length];document.getElementById('themeSelect').value=nx;setTheme(nx);}
function setTheme(t){monaco.editor.setTheme(t);localStorage.setItem(THEME_KEY,t);document.body.classList.toggle('light',t==='vs');}
document.getElementById('themeSelect').addEventListener('change',e=>setTheme(e.target.value));
document.getElementById('langSelect').addEventListener('change',e=>{const m=getActiveModel();if(!m)return;monaco.editor.setModelLanguage(m,e.target.value);const t=state.tabs.find(x=>x.id===state.activeTabId);if(t)t.language=e.target.value;saveToStorage();});
document.getElementById('splitSelect').addEventListener('change',e=>{const c=document.getElementById('mainContainer');c.classList.remove('split-horizontal','hide-preview','hide-editor');document.getElementById('editor').style.flex='';if(e.target.value==='split-horizontal')c.classList.add('split-horizontal');else if(e.target.value==='editor-only')c.classList.add('hide-preview');else if(e.target.value==='preview-only')c.classList.add('hide-editor');if(editor)editor.layout();});
(function(){const r=document.getElementById('resizer'),ed=document.getElementById('editor');let drag=false,sp=0,ss=0,hor=false;
r.addEventListener('mousedown',e=>{drag=true;hor=document.getElementById('mainContainer').classList.contains('split-horizontal');sp=hor?e.clientY:e.clientX;ss=ed.getBoundingClientRect()[hor?'height':'width'];document.body.style.userSelect='none';});
window.addEventListener('mousemove',e=>{if(!drag)return;const d=(hor?e.clientY:e.clientX)-sp;const n=Math.max(100,ss+d);ed.style.flex=`0 0 ${n}px`;editor.layout();});
window.addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect='';});})();
function openSnippets(){const l=document.getElementById('snippetsList');l.innerHTML='';SNIPPETS.forEach(s=>{const d=document.createElement('div');d.className='snippet-item';d.innerHTML=`<h3>${escapeHtml(s.name)}</h3><p>${escapeHtml(s.desc)}</p>`;d.onclick=()=>{addNewTab(s.code,s.lang,s.name);closeSnippets();showToast('✅ تم الإضافة');};l.appendChild(d);});document.getElementById('snippetsModal').classList.add('open');}
function closeSnippets(){document.getElementById('snippetsModal').classList.remove('open');}
function shareLink(){if(!getActiveModel())return;try{const code=getModelValue();const lang=document.getElementById('langSelect').value;const e=btoa(unescape(encodeURIComponent(JSON.stringify({c:code,l:lang}))));const url=location.origin+location.pathname+'#code='+e;navigator.clipboard.writeText(url).then(()=>showToast('🔗 تم نسخ الرابط')).catch(()=>prompt('انسخ:',url));}catch(e){showToast('❌ فشل');}}
function checkShareLink(){if(!location.hash.startsWith('#code='))return;try{const e=location.hash.substring(6);const d=JSON.parse(decodeURIComponent(escape(atob(e))));if(d.c&&d.l){addNewTab(d.c,d.l,'shared.'+(d.l==='javascript'?'js':d.l==='html'?'html':'txt'));history.replaceState(null,'',location.pathname);showToast('✅ تم تحميل الكود المشترك');}}catch(e){console.error(e);}}
async function exportImage(){try{const el=document.getElementById('editor');const c=await html2canvas(el,{backgroundColor:'#1e1e1e',scale:2});c.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='code.png';a.click();URL.revokeObjectURL(u);showToast('🖼 تم التصدير');});}catch(e){showToast('❌ '+e.message);}}
function updateStatus(){const m=getActiveModel();if(!m)return;const t=m.getValue();const w=t.trim().split(/\s+/).filter(Boolean).length;document.getElementById('statusStats').textContent=`${m.getLineCount()} سطر | ${w} كلمة | ${t.length} حرف`;}
function askAI(){showToast('🤖 ميزة AI هتتوصل في المرحلة الجاية');}
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'}});
require(['vs/editor/editor.main'],initEditor);
window.addEventListener('beforeunload',saveToStorage);
</script>
