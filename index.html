<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرري الذكي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: #1e1e1e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { background: #252526; padding: 8px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 8px; }
.header-top { display: flex; justify-content: space-between; padding: 0 8px; }
header h1 { font-size: 16px; color: #4ec9b0; }
.toolbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.toolbar::-webkit-scrollbar { display: none; }
button, select { background: #0e639c; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }
select { background: #3c3c3c; }
button:hover { background: #1177bb; }
.container { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
#editorWrapper { flex: 1; overflow: hidden; position: relative; min-height: 200px;}
.CodeMirror { height: 100% !important; font-size: 14px; direction: ltr; text-align: left; }
#preview { flex: 1; background: #fff; border: none; min-height: 200px; }
.console-panel { height: 120px; background: #252526; border-top: 1px solid #333; display: flex; flex-direction: column; flex-shrink: 0; }
.console-header { padding: 6px; font-size: 12px; background: #2d2d2d; cursor: pointer; display: flex; justify-content: space-between; }
.console-body { flex: 1; overflow-y: auto; font-family: monospace; font-size: 12px; padding: 4px; }
.console-line { border-bottom: 1px solid #333; padding: 2px 0; color: #4ec9b0; }
.console-line.error { color: #f48771; }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>🧠 محرري الذكي</h1>
  </div>
  <div class="toolbar">
    <select id="langSelect" onchange="changeLang()">
      <option value="htmlmixed">HTML</option>
      <option value="javascript">JS</option>
      <option value="css">CSS</option>
    </select>
    <button onclick="runCode()">▶ شغّل</button>
    <button onclick="copyCode()">📋 نسخ</button>
    <button onclick="downloadFile()">⬇ تحميل</button>
    <button onclick="loadDefault()">📄 كود جديد</button>
  </div>
</header>

<div class="container">
  <div id="editorWrapper"><textarea id="codeArea"></textarea></div>
  <iframe id="preview"></iframe>
</div>

<div class="console-panel">
  <div class="console-header" onclick="toggleConsole()">
    <span>🖥 Console</span>
    <span>▼</span>
  </div>
  <div class="console-body" id="consoleBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<script>
var DEFAULT_CODE = '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <style>\n    body { font-family:sans-serif; text-align:center; padding:50px; background:#f0f0f0; }\n    h1 { color: #4CAF50; }\n  </style>\n</head>\n<body>\n  <h1>مرحبا بالعالم 👋</h1>\n  <p>جرب تكتب كودك هنا!</p>\n  <button onclick="console.log(\'تم الضغط!\')">اضغطني</button>\n  <script>console.log("أهلاً بيك في المحرر!");<\/script>\n</body>\n</html>';

var editor = CodeMirror.fromTextArea(document.getElementById("codeArea"), {
  lineNumbers: true,
  mode: "htmlmixed",
  theme: "dracula",
  autoCloseBrackets: true,
  matchBrackets: true,
  lineWrapping: true,
  indentUnit: 4
});

editor.setValue(DEFAULT_CODE);

var CONSOLE_INJECT = '<script>(function(){var s=function(l,a){try{parent.postMessage({type:"console",level:l,args:a.map(function(x){try{return typeof x==="object"?JSON.stringify(x):String(x);}catch(e){return String(x);}})}, "*");}catch(e){}};["log","error","warn","info"].forEach(function(m){var o=console[m];console[m]=function(){var a=[].slice.call(arguments);s(m,a);if(o)o.apply(console,a);};});window.onerror=function(msg,url,line){s("error",[msg+(line?" (سطر "+line+")":"")]);};})();<\/script>';

function runCode() {
  var code = editor.getValue();
  var lang = document.getElementById('langSelect').value;
  var preview = document.getElementById('preview');
  document.getElementById('consoleBody').innerHTML = '';
  
  var srcdoc = '';
  if(lang === 'htmlmixed') {
    if(code.indexOf('</head>') !== -1) srcdoc = code.replace('</head>', CONSOLE_INJECT + '</head>');
    else if(/<body[^>]*>/i.test(code)) srcdoc = code.replace(/<body[^>]*>/i, function(m){ return m + CONSOLE_INJECT; });
    else srcdoc = CONSOLE_INJECT + code;
  } else if(lang === 'javascript') {
    srcdoc = CONSOLE_INJECT + '<body style="font-family:monospace;padding:20px;background:#1e1e1e;color:#fff"><script>' + code + '<\/script></body>';
  } else {
    srcdoc = '<pre style="padding:20px;font-family:monospace">هذه اللغة غير مدعومة للمعاينة.</pre>';
  }
  preview.srcdoc = srcdoc;
}

window.addEventListener('message', function(e) {
  if(e.data && e.data.type === 'console') {
    var b = document.getElementById('consoleBody');
    var l = document.createElement('div');
    l.className = 'console-line ' + (e.data.level || 'log');
    l.textContent = '› ' + (e.data.args || []).join(' ');
    b.appendChild(l); b.scrollTop = b.scrollHeight;
  }
});

function changeLang() {
  var lang = document.getElementById('langSelect').value;
  editor.setOption("mode", lang);
}

function copyCode() {
  navigator.clipboard.writeText(editor.getValue()).then(function(){ alert('تم النسخ!'); });
}

function downloadFile() {
  var blob = new Blob([editor.getValue()], {type: 'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'code.html';
  a.click();
}

function loadDefault() {
  editor.setValue(DEFAULT_CODE);
  document.getElementById('langSelect').value = 'htmlmixed';
  changeLang();
  runCode();
}

function toggleConsole() {
  var p = document.querySelector('.console-panel');
  p.style.height = p.style.height === '32px' ? '120px' : '32px';
}

editor.on("change", function() {
  clearTimeout(window.debounceTimer);
  window.debounceTimer = setTimeout(runCode, 500);
});

runCode();
</script>
</body>
</html>
